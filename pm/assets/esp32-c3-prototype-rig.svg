<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">BALAT ESP32-C3 supervised prototype rig</title>
  <desc id="desc">An isometric electronics bench rig with an ESP32-C3 board, GNSS receiver, protected dummy cue drivers, status LEDs, manual disable switch, and USB replay logger.</desc>
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#d8d1c5"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#707b82"/>
      <stop offset=".48" stop-color="#384249"/>
      <stop offset="1" stop-color="#1b2228"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#267b68"/>
      <stop offset="1" stop-color="#123e3d"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39444a"/>
      <stop offset="1" stop-color="#151b20"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .edge{stroke:#11191e;stroke-width:2;stroke-linejoin:round}
      .fine{fill:none;stroke:#9ba7ad;stroke-width:1.5;stroke-linecap:round}
      .wire{fill:none;stroke:#d69b58;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wire2{fill:none;stroke:#6bb6a5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#c5cfce;font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px}
      .micro{fill:#d7dfdc;font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px}
      .darkmicro{fill:#273238;font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px}
    </style>
  </defs>

  <ellipse cx="588" cy="686" rx="475" ry="38" fill="#0b1014" opacity=".42" filter="url(#shadow)"/>

  <!-- bench plate, feet, corner screws, cable trough -->
  <path class="edge" fill="#252e34" d="M92 528 598 355 1110 504 604 694Z"/>
