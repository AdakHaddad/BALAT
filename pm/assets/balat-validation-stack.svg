<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">BALAT validation stack</title>
  <desc id="desc">An isometric laboratory rack with five removable validation trays: GNSS input, map and geometry, risk state, cue safety, and replay logging.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#d8d1c5"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#697179"/>
      <stop offset=".45" stop-color="#343c43"/>
      <stop offset="1" stop-color="#1b2228"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#445058"/>
      <stop offset="1" stop-color="#20282e"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6a668"/>
      <stop offset=".5" stop-color="#9a5736"/>
      <stop offset="1" stop-color="#5a3025"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .edge{stroke:#12181d;stroke-width:2;stroke-linejoin:round}
      .fine{fill:none;stroke:#9ba7ad;stroke-width:1.5;stroke-linecap:round}
      .tick{stroke:#d9e0df;stroke-width:2;stroke-linecap:round}
      .muted{fill:#9ba7ad;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}
      .micro{fill:#c5cfce;font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px}
    </style>
  </defs>

  <ellipse cx="505" cy="555" rx="395" ry="33" fill="#0b1014" opacity=".45" filter="url(#shadow)"/>

  <!-- base plate, feet, and corner hardware -->
  <path class="edge" fill="#252e34" d="M140 477 512 358 886 468 510 594Z"/>
  <path class="edge" fill="url(#steel)" d="M140 477 510 594 510 610 140 492Z"/>
  <path class="edge" fill="#171e23" d="M510 594 886 468 886 485 510 610Z"/>
  <path class="edge" fill="#4a555b" d="M160 468 512 356 866 463 510 575Z"/>
