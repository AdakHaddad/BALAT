    <circle cx="185" cy="477" r="7"/><circle cx="510" cy="574" r="7"/>
    <circle cx="843" cy="465" r="7"/><circle cx="510" cy="369" r="7"/>
  </g>
  <g fill="#11181d" stroke="#77848a" stroke-width="1">
    <circle cx="196" cy="484" r="3"/><circle cx="511" cy="584" r="3"/>
    <circle cx="830" cy="469" r="3"/><circle cx="512" cy="380" r="3"/>
  </g>

